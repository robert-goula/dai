[package]
name = "dai-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dai-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.1", features = ["v4"] }
