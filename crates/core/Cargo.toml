[package]
name = "dai-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
htmd = "0.5.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26.2"

[dev-dependencies]
tempfile = "3.27.0"
