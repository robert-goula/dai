[package]
name = "dai-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.2.0"
anyhow = "1.0.104"
comrak = { version = "0.55.0", default-features = false }
directories = "6.0.0"
flate2 = "1.1.10"
htmd = "0.5.5"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
tantivy = "0.26.2"
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
